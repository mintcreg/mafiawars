# docker-compose.yml
version: '3.8'

services:
  web:
    build: .
    command: gunicorn the_syndicate.wsgi:application --bind 0.0.0.0:8033
    # volumes:  <-- DELETE THIS SECTION
    #   - /data/mafiawars/app:/app
    ports:
      - "8033:8033"
    environment:
      # ... (environment variables are correct, leave them)
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:13
    volumes: # <-- THIS VOLUME IS CORRECT, LEAVE IT ALONE
      - /data/mafiawars/db:/var/lib/postgresql/data/
    environment:
      # ... (environment variables are correct, leave them)
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A the_syndicate worker -l info
    # volumes: <-- DELETE THIS SECTION
    #   - /data/mafiawars/app:/app
    environment:
      # ... (environment variables are correct, leave them)
    depends_on:
      - db
      - redis
    restart: unless-stopped
      
  celery_beat:
    build: .
    command: celery -A the_syndicate beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    # volumes: <-- DELETE THIS SECTION
    #   - /data/mafiawars/app:/app
    environment:
      # ... (environment variables are correct, leave them)
    depends_on:
      - db
      - redis
    restart: unless-stopped
