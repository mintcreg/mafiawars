# This file should be in the root of your Git repository
version: '3.8'

services:
  web:
    build: .  # Portainer will run this from the cloned repo's root
    command: gunicorn the_syndicate.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - /data/mafiawars/app:/app # Mount the persistent host directory
    ports:
      - "8000:8000"
    env_file:
      - stack.env # Portainer will look for this file in the repo
    depends_on:
      - db
      - redis

  db:
    image: postgres:13
    volumes:
      - /data/mafiawars/db:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=the_syndicate_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    restart: unless-stopped

  # ... (rest of the services: redis, celery_worker, celery_beat) are the same
  # but make sure their build directive is just "build: ." if they have one
  # and their volumes point to the persistent host directory if needed.

  redis:
    image: redis:6-alpine
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A the_syndicate worker -l info
    volumes:
      - /data/mafiawars/app:/app
    env_file:
      - stack.env
    depends_on:
      - db
      - redis
    restart: unless-stopped
      
  celery_beat:
    build: .
    command: celery -A the_syndicate beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - /data/mafiawars/app:/app
    env_file:
      - stack.env
    depends_on:
      - db
      - redis
    restart: unless-stopped