# Final, correct docker-compose.yml
version: '3.8'

services:
  web:
    build: .
    command: gunicorn the_syndicate.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=a-very-secret-key-please-change-for-production
      - DEBUG=1
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 web
      - DATABASE_URL=postgres://user:password@db:5432/the_syndicate_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:13
    volumes:
      - /data/mafiawars/db:/var/lib/postgresql/data/
    # This environment section MUST be indented correctly.
    environment:
      - POSTGRES_DB=the_syndicate_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A the_syndicate worker -l info
    environment:
      - SECRET_KEY=a-very-secret-key-please-change-for-production
      - DEBUG=1
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 web
      - DATABASE_URL=postgres://user:password@db:5432/the_syndicate_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
    depends_on:
      - db
      - redis
    restart: unless-stopped
      
  celery_beat:
    build: .
    command: celery -A the_syndicate beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - SECRET_KEY=a-very-secret-key-please-change-for-production
      - DEBUG=1
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 web
      - DATABASE_URL=postgres://user:password@db:5432/the_syndicate_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
    depends_on:
      - db
      - redis
    restart: unless-stopped
